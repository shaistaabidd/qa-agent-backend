default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
  password: <%= ENV["DATABASE_PASSWORD"] %>

development:
  <<: *default
  database: qa_agent_backend_development

test:
  <<: *default
  database: qa_agent_backend_test

# Connection details come from DATABASE_URL, which Rails merges over this block.
production:
  <<: *default
  database: qa_agent_backend_production
  # Stay well under Heroku's 30-second router timeout.
  variables:
    statement_timeout: 15s
