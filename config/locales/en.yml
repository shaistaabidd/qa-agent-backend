    scope_feature_not_approved: "Approve this scope feature before running it."
    sign_up_disabled: "New accounts are not being accepted right now. Please try again later."
    validation_failed: "Some details aren't valid. Please check them and try again."
    unauthenticated: "Your session has expired or you are not authenticated. Please log in to continue."
    sign_in_blocked:
      access_revoked: "Account access has been revoked. Please contact admin to get it enabled!"
      archived: "This account has been archived. Please contact admin."
      invitation_pending: "Accept your invitation to set a password first."

  auth:
    code_sent_to: "We sent a 6-digit code to %{email}."
    email_changed: "Your email address has been updated."
    logged_out: "You have been logged out."
    password_reset_requested: "If an account exists for that email, we sent a verification code."
    signed_in: "You're signed in."
    verification_code_resent: "If a verification is in progress, we sent a new code."
    verification_code_sent: "We sent a verification code to your email."

  invitations:
    deleted: "Invitation deleted."
    sent:
      one: "Invitation sent."
      other: "%{count} invitations sent."

  activerecord:
    errors:
      models:
        user:
          attributes:
            phone:
              invalid: "must be a valid phone number with its country code, like +1 201 555 0123"
        project:
          attributes:
            target_url:
              private_address: "must be a public web address, not a local or private one"
      messages:
        password_missing_uppercase: "must include an uppercase letter"
        password_missing_lowercase: "must include a lowercase letter"
        password_missing_special: "must include a special character"
        password_too_long: "is too long (maximum is %{count} bytes)"

  auth_mailer:
    verification_code:
      subject:
        login: "Your login code"
        password_reset: "Your password reset code"
        email_confirmation: "Confirm your new email address"
      intro:
        login: "Use this code to finish signing in:"
        password_reset: "Use this code to reset your password:"
        email_confirmation: "Use this code to confirm this is your new email address:"
      expiry: "The code expires in %{minutes} minutes."
      ignore: "If you did not request this, you can ignore this email."

  invitation_mailer:
    invitation:
      subject: "You're invited to %{app_name}"
      intro: "You have been invited to join %{app_name}."
      intro_with_inviter: "%{inviter} invited you to join %{app_name}."
      accept: "Accept invitation"
      expiry: "This invitation expires in %{days} days."

  user_mailer:
    email_changed:
      subject: "Your email address was changed"
      body: "The email address on your account was changed to %{email}."
      not_you: "If you did not make this change, contact support right away."
    registration_attempted:
      subject: "Sign-up attempt for your %{app_name} account"
      body: "Someone tried to create a new account with this email address, which already has an account."
      next_step: "If that was you, log in or reset your password instead. If not, you can ignore this email."

  sms:
    not_configured: "Twilio is not configured: set TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN and TWILIO_FROM_NUMBER."
    welcome: "Welcome to %{app_name}, %{first_name}! Your account is all set."
    errors:
      unknown: "Twilio error %{code}."
      "21211": "The phone number is not valid."
      "21608": "Trial accounts can only text numbers verified in the Twilio Console."
      "21408": "Sending to this country is not enabled for the account."
      "21610": "The recipient has opted out of messages (replied STOP)."
      "21612": "This number cannot receive messages from the sender."
      "21614": "The number is not a mobile number that can receive SMS."

