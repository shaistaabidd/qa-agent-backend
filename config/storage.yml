# Private bucket only. Clients receive short-lived signed URLs.

test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Heroku has no IAM roles, so a dedicated least-privilege IAM user's keys come
# from config vars. Grant it only s3:GetObject, s3:PutObject
# and s3:DeleteObject on this one bucket.
amazon:
  service: S3
  region: <%= ENV.fetch("AWS_REGION", "us-east-1") %>
  bucket: <%= ENV.fetch("S3_BUCKET", "") %>
  access_key_id: <%= ENV.fetch("AWS_ACCESS_KEY_ID", "") %>
  secret_access_key: <%= ENV.fetch("AWS_SECRET_ACCESS_KEY", "") %>
